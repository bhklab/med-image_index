[workspace]
authors = ["Joshua Siraj <joshua.siraj@ryerson.ca>"]
channels = ["conda-forge"]
name = "med-image_index"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = ">=3.11,<3.14"
jupyterlab = ">=4.6.2,<5"
numpy = "<2"
pixi-kernel = ">=0.7.1,<0.8"
rarfile = ">=4.2,<5"
unrar = ">=0.4,<0.5"
notebook = ">=7.6.2,<8"
liblzma = ">=5.8.3,<6"
unzip = ">=6.0,<7"
hf-xet = ">=1.5.2,<2"

[pypi-dependencies]
med-image-index = { path = ".", editable = true }
nbia-toolkit = { git = "https://github.com/bhklab/nbia-toolkit.git", branch = "project/med-imagenet-indexing" }
tcia_utils = "<3.2.0"
openpyxl = ">=3.1.5, <4"
pyarrow = ">=15, <22"
tabulate = ">=0.10.0, <0.11"
pydicom = ">= 2.4.5"
huggingface_hub = ">= 1.26.0"
